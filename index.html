<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ayah Tab</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>📖 Ayah Tab</h1>

    <section class="card">
      <p id="ayah-ar" class="ayah-ar">Loading...</p>
      <p id="ayah-en" class="ayah-en"></p>
      <p id="ayah-ref" class="ayah-ref"></p>
      <details class="tafsir">
        <summary>Tafsir</summary>
        <p id="tafsir-text">Loading tafsir...</p>
      </details>
    </section>

    <section class="controls">
      <button id="prev">⬅ Previous</button>
      <button id="play">🔊 Play Audio</button>
      <button id="next">Next ➡</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
